# CrestSuite — full containerized stack.
#
#   docker compose up -d --build
#   -> portal (with LeaveMS + QMS in-process and the ClockIT web app) on :8080
#   -> ClockIT API in its own container (proxied by the portal, not published)
#   -> PostgreSQL / Redis / MailHog
#
# NOTE: this reuses the SAME PostgreSQL volume (clockit_pgdata) as the old
# apps/clockit/docker-compose.yml, so all existing data carries over. Stop
# that older stack first (`docker compose down` inside apps/clockit) —
# both publish 5433. For local non-Docker dev, keep using `npm start`.

name: crestsuite

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clockit
      POSTGRES_PASSWORD: clockit
      POSTGRES_DB: clockit
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clockit"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  clockit-api:
    build: ./apps/clockit
    environment:
      DATABASE_URL: postgresql://clockit:clockit@postgres:5432/clockit
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-me-in-prod
      PORTAL_SECRET: crestsuite-portal-dev-secret-change-in-production

      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USER: educatetrade02@gmail.com
      SMTP_PASS: iqiwiqmymtswmdly
      SMTP_FROM: educatetrade02@gmail.com

      APP_URL: http://localhost:8080
      API_URL: http://clockit-api:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  portal:
    build:
      context: .
      dockerfile: portal/Dockerfile
    environment:
      PORTAL_PORT: 8080
      PORTAL_URL: http://localhost:8080
      PORTAL_SECRET: crestsuite-portal-dev-secret-change-in-production
      JWT_SECRET: leavems-dev-secret-change-in-production
      CRESTSUITE_DATABASE_URL: postgresql://clockit:clockit@postgres:5432/crestsuite
      CRESTSUITE_ADMIN_DB: clockit
      CLOCKIT_API_URL: http://clockit-api:3000

      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USER: educatetrade02@gmail.com
      SMTP_PASS: iqiwiqmymtswmdly
      SMTP_FROM: educatetrade02@gmail.com

    ports:
      - "8080:8080"
    volumes:
      - qmsdata:/suite/apps/qms/data   # QMS audit trail + signing key persist here
    depends_on:
      postgres:
        condition: service_healthy
      clockit-api:
        condition: service_started

volumes:
  pgdata:
    name: clockit_pgdata   # renamed from clockify_pgdata; data was copied across
  qmsdata:
